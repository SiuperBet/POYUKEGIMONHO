name: Build POYUKEGIMONHO Mobile

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Typecheck mobile
        run: npm run typecheck
      - name: Patch Expo Camera Android crash guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("node_modules/expo-camera/android/src/main/java/expo/modules/camera/ExpoCameraView.kt")
          source = path.read_text()
          old = "  val cameraProvider = ProcessCameraProvider.awaitInstance(context)"
          new = """  val cameraProvider = try {
            ProcessCameraProvider.awaitInstance(context)
          } catch (e: Exception) {
            shouldCreateCamera = true
            onMountError(CameraMountErrorEvent("Camera unavailable: ${e.message ?: e.javaClass.simpleName}"))
            return
          }"""
          if old not in source:
            raise SystemExit("Expo Camera source changed: expected awaitInstance line not found")
          path.write_text(source.replace(old, new, 1))
          print("Expo Camera Android crash guard applied")
          PY
      - name: Set Android build number
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync('app.json',JSON.stringify(p,null,2)+'\\n')"
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: poyukegimonho-android-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android release for in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v0.1.0-build-${{ github.run_number }}
          name: POYUKEGIMONHO Mobile #${{ github.run_number }}
          generate_release_notes: true
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
# Local Gradle build: no EAS queue.
