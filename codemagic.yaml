workflows:
  web-build:
    name: POYUKEGIMONHO Web Build
    max_build_duration: 30
    instance_type: linux_x2

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: "codemagic/**"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm install
      - name: Run tests
        script: npm test
      - name: Build web app
        script: npm run build

    artifacts:
      - dist/**
